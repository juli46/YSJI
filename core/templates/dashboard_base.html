{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="shortcut icon" href="{% static 'images/icon.png' %}" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="apple-touch-icon" href="{% static 'images/logo.jpg' %}" />
    <link rel="stylesheet" href="{% static 'css/st.css' %}" />
    <link rel="stylesheet" href="{% static 'css/s.css' %}" />
    <link rel="stylesheet" href="{% static 'css/productos.css' %}" />
    <link rel="stylesheet" href="{% static 'css/boar.css'%}" />

    <style>
      /* --- Barra lateral y scroll --- */
      .barra-lateral {
          display: flex;
          flex-direction: column;
          height: 100vh;
          overflow: hidden;
          justify-content: space-between;
      }

      .barra-lateral nav.navegacion {
          flex: 1;
          overflow-y: auto;
          padding-right: 4px;
      }

      .barra-lateral nav.navegacion::-webkit-scrollbar {
          width: 6px;
      }
      .barra-lateral nav.navegacion::-webkit-scrollbar-thumb {
          background-color: rgba(0,0,0,0);
          border-radius: 3px;
          transition: background 0.3s;
      }
      .barra-lateral nav.navegacion:hover::-webkit-scrollbar-thumb {
          background-color: rgba(0,0,0,0.25);
      }
      .barra-lateral nav.navegacion::-webkit-scrollbar-track {
          background: transparent;
      }

      /* --- Perfil Admin reducido --- */
      .admin-profile-sidebar {
          background: #fff;
          border-radius: 12px;
          box-shadow: 0 2px 6px #0001;
          margin: 12px 8px;
          padding: 6px 6px;
          display: flex;
          align-items: center;
          gap: 6px;
          transition: background 0.3s, color 0.3s;
      }

      body.dark-mode .admin-profile-sidebar {
          background: transparent;
          color: #f1f1f1;  
          box-shadow: 0 2px 6px #0007;
      }

      .admin-profile-sidebar img {
          width: 20px;
          height: 20px;
          border-radius: 50%;
          border: 1.5px solid #000;
          object-fit: cover;
      }

      .perfil-admin-flex {
          display: flex;
          align-items: center;
          justify-content: flex-start;
          flex: 1;
          gap: 6px;
      }

      .perfil-admin-flex .ms-2 {
          margin-left: 6px;
          line-height: 1.1;
          font-size: 0.85em;
      }
      .perfil-admin-flex .fw-bold {
          font-size: 0.95em;
          font-weight: bold;
      }
      .perfil-admin-flex .text-muted {
          font-size: 0.75em;
          color: #888;
      }

      .menu-tres-puntos {
          position: relative;
          outline: none;
      }
      .menu-tres-puntos .puntos {
          font-size: 1.5em;
          cursor: pointer;
          user-select: none;
      }
      .menu-tres-puntos .menu-opciones {
          display: none;
          position: absolute;
          right: 0;
          top: 32px;
          background: #fff;
          border: 1px solid #ddd;
          border-radius: 8px;
          min-width: 120px;
          box-shadow: 0 2px 8px #0002;
          z-index: 100;
      }
      .menu-tres-puntos:focus .menu-opciones,
      .menu-tres-puntos:hover .menu-opciones {
          display: block;
      }
      .menu-tres-puntos .menu-opciones a {
          display: block;
          padding: 8px 12px;
          color: #222;
          text-decoration: none;
          font-size: 0.9em;
          border-radius: 6px;
          transition: background 0.2s;
      }
      .menu-tres-puntos .menu-opciones a:hover {
          background: #f2f2f2;
      }
    </style>
  </head>

  <body>
    <div class="menu">
      <ion-icon name="menu-outline"></ion-icon>
      <ion-icon name="close-outline"></ion-icon>
    </div>

    <div class="barra-lateral">
      <div>
        <div class="nombre-pagina">
          <ion-icon id="cloud" name="cloud-outline"></ion-icon>
          <span>YSJI FASHION</span>
        </div>
        <div class="admin-profile-sidebar">
          <div class="perfil-admin-flex">
            <img src="{% if usuario_admin and usuario_admin.imagen_perfil %}{{ usuario_admin.imagen_perfil.url }}{% else %}{% static 'images/user-default.png' %}{% endif %}" alt="Perfil"/>
            <div class="ms-2 text-start">
              <span class="fw-bold">{{ usuario_admin.nombre|default:"Admin" }}</span><br/>
            </div>
            <div class="menu-tres-puntos" tabindex="0">
              <span class="puntos">&#8942;</span>
              <div class="menu-opciones">
                <a href="{% url 'editar_perfil' %}">Editar perfil</a>
              </div>
            </div>
          </div>
        </div>

       

        <nav class="navegacion">
          <ul>
            <li class="{% if request.path == '/dashboard/' %}active{% endif %}">
              <a href="{% url 'dashboard'%}">
                <ion-icon name="grid-outline"></ion-icon>
                <span>Dashboard</span>
              </a>
            </li>
            <li class="{% if request.path == '/usuarios/' %}active{% endif %}">
              <a href="{% url 'dashboard_usuarios' %}">
                <ion-icon name="people-outline"></ion-icon>
                <span>Usuarios</span>
              </a>
            </li>
            <li class="{% if request.path == '/proveedores/' %}active{% endif %}">
              <a href="{% url 'dashboard_proveedores' %}">
                <ion-icon name="business-outline"></ion-icon>
                <span>Proveedores</span>
              </a>
            </li>
            <li class="{% if request.path == '/AgregarProducto/' %}active{% endif %}">
              <a href="{% url 'AgregarProducto'%}">
                <ion-icon name="shirt-outline"></ion-icon>
                <span>Productos</span>
              </a>
            </li>
            <li class="{% if request.path == '/pedidos/' %}active{% endif %}">
              <a href="{% url 'dashboard_pedidos' %}">
                <ion-icon name="receipt-outline"></ion-icon>
                <span>Pedidos</span>
              </a>
            </li>
            <li class="{% if request.path == '/marcas/' %}active{% endif %}">
              <a href="{% url 'marcas_list' %}">
                <ion-icon name="pricetags-outline"></ion-icon>
                <span>Marcas</span>
              </a>
            </li>
            <li class="{% if request.path == '/dashboard/categorias/' %}active{% endif %}">
              <a href="{% url 'dashboard_categorias' %}">
                <ion-icon name="list-outline"></ion-icon>
                <span>Categorías</span>
              </a>
            </li>
            <li class="{% if request.path == '/blogs/' %}active{% endif %}">
              <a href="{% url 'blog_list' %}">
                <ion-icon name="newspaper-outline"></ion-icon>
                <span>Blog</span>
              </a>
            </li>
            <li class="{% if request.path == '/dashboard/contactos/' %}active{% endif %}">
              <a href="{% url 'dashboard_contacto' %}">
                <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
                <span>Mensajes</span>
              </a>
            </li>
            <li class="{% if request.path == '/dashboard/descuentos/' %}active{% endif %}">
              <a href="{% url 'dashboard_descuentos' %}">
                <ion-icon name="gift-outline"></ion-icon>
                <span>Descuentos</span>
              </a>
            </li>
            <li class="{% if request.path == '/login/' %}active{% endif %}">
              <a href="{% url 'logout'%}">
                <ion-icon name="log-out-outline"></ion-icon>
                <span>Salir</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
      <div class="modo-oscuro">
        <div class="info">
          <ion-icon name="moon-outline"></ion-icon>
          <span>Modo Oscuro</span>
        </div>
        <div class="switch">
          <div class="base">
            <div class="circulo"></div>
          </div>
        </div>
      </div>
    </div>

    <main>{% block content %}{% endblock %}</main>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <script src="{% static 'js/das.js'%}"></script>
    <script src="{% static 'js/script.js' %}"></script>
  </body>
</html>
